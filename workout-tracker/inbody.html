<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>인바디 기록 - 운동 트래커</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="inbody">
  <header>
    <div class="header-content">
      <h1>인바디 기록</h1>
      <a href="index.html" class="btn" style="background: var(--bg-main); color: var(--text-primary); padding: 0.5rem 1rem;">
        돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2 class="card-title">새 인바디 기록</h2>
      
      <div class="form-group">
        <label class="form-label">측정 날짜</label>
        <input type="date" id="inbody-date" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">체중 (kg)</label>
        <input type="number" step="0.1" id="weight" class="form-input" placeholder="예: 62.8">
        <small id="last-weight" style="color: var(--text-secondary); margin-top: 0.25rem; display: block;"></small>
      </div>

      <div class="form-group">
        <label class="form-label">골격근량 (kg)</label>
        <input type="number" step="0.1" id="muscle" class="form-input" placeholder="예: 27.4">
        <small id="last-muscle" style="color: var(--text-secondary); margin-top: 0.25rem; display: block;"></small>
      </div>

      <div class="form-group">
        <label class="form-label">체지방률 (%)</label>
        <input type="number" step="0.1" id="bodyfat" class="form-input" placeholder="예: 19.5">
        <small id="last-bodyfat" style="color: var(--text-secondary); margin-top: 0.25rem; display: block;"></small>
      </div>

      <button id="save-inbody" class="btn btn-success btn-full">
        인바디 기록 저장하기
      </button>
    </div>

    <!-- 인바디 히스토리 -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">인바디 기록 히스토리</h2>
      </div>
      <div id="inbody-history">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- 인바디 팁 -->
    <div class="card" style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border: 1px solid #bbf7d0;">
      <h3 style="color: #059669; margin-bottom: 0.75rem; font-size: 1rem;">💡 인바디 측정 팁</h3>
      <ul style="color: var(--text-secondary); line-height: 1.8; padding-left: 1.25rem; font-size: 0.95rem;">
        <li>가능하면 같은 시간대에 측정하세요 (오전 추천)</li>
        <li>운동 직후나 식사 직후는 피하세요</li>
        <li>수분 섭취에 따라 0.5~1kg 차이가 날 수 있습니다</li>
        <li>한 번의 측정보다 <strong>추세</strong>를 보는 것이 중요합니다</li>
        <li>2주~1개월 단위로 측정하는 것을 권장합니다</li>
      </ul>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-label">히스토리</div>
    </a>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- 앱 스크립트 -->
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
