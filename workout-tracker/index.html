<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="개인 운동 기록 트래커">
  <meta name="theme-color" content="#2563eb">
  <title>운동 트래커 - 대시보드</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body data-page="dashboard">
  <header>
    <div class="header-content">
      <h1>운동 트래커</h1>
      <div>
        <button class="btn btn-primary" onclick="location.href='record.html'">기록하기</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 통계 요약 -->
    <div class="stats-compact">
      <div class="stat-item">
        <div class="stat-compact-label">총 운동</div>
        <div class="stat-compact-value" id="total-workouts">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-compact-label">7일</div>
        <div class="stat-compact-value" id="recent-workouts">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-compact-label">체중</div>
        <div class="stat-compact-value" id="current-weight">-</div>
      </div>
      <div class="stat-item">
        <div class="stat-compact-label">골격근</div>
        <div class="stat-compact-value" id="current-muscle">-</div>
      </div>
    </div>

    <!-- 빠른 메뉴 -->
    <div class="card">
      <h2 class="card-title">빠른 메뉴</h2>
      <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
        <a href="record.html" class="btn btn-primary" style="flex: 1;">운동 기록</a>
        <a href="inbody.html" class="btn btn-success" style="flex: 1;">인바디</a>
        <a href="stats.html" class="btn" style="flex: 1; background: var(--text-secondary); color: white;">
          통계
        </a>
      </div>
    </div>

    <!-- 운동 달력 -->
    <div class="card">
      <div class="card-header">
        <button class="calendar-nav-btn" id="prev-month">&lt;</button>
        <h2 class="card-title" id="calendar-month">2026년 8월</h2>
        <button class="calendar-nav-btn" id="next-month">&gt;</button>
      </div>
      <div class="calendar" id="workout-calendar">
        <!-- 동적으로 생성 -->
      </div>
    </div>

    <!-- 최근 운동 기록 -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">최근 운동 기록</h2>
        <a href="history.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          전체보기
        </a>
      </div>
      <ul id="recent-history" class="history-list">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </ul>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-label">히스토리</div>
    </a>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- 앱 스크립트 -->
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
