<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="개인 운동 기록 트래커">
  <meta name="theme-color" content="#2563eb">
  <title>운동 트래커 - 대시보드</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body data-page="dashboard">
  <header>
    <div class="header-content">
      <h1>운동 트래커</h1>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <div class="theme-toggle" id="theme-toggle"></div>
        <button class="btn btn-primary" onclick="location.href='record.html'">기록하기</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 통계 카드 -->
    <div class="stats-grid">
      <div class="stat-card" style="background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%)">
        <div class="stat-label">총 운동 횟수</div>
        <div class="stat-value" id="total-workouts">0</div>
        <div class="stat-change">기록 시작 이후</div>
      </div>

      <div class="stat-card" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%)">
        <div class="stat-label">최근 7일 운동</div>
        <div class="stat-value" id="recent-workouts">0</div>
        <div class="stat-change">회</div>
      </div>

      <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%)">
        <div class="stat-label">현재 체중</div>
        <div class="stat-value" id="current-weight">-</div>
        <div class="stat-change" id="weight-change">kg</div>
      </div>

      <div class="stat-card" style="background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%)">
        <div class="stat-label">골격근량</div>
        <div class="stat-value" id="current-muscle">-</div>
        <div class="stat-change" id="muscle-change">kg</div>
      </div>
    </div>

    <!-- 최근 운동 기록 -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">최근 운동 기록</h2>
        <a href="history.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          전체보기 →
        </a>
      </div>
      <ul id="recent-history" class="history-list">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </ul>
    </div>

    <!-- 빠른 액션 -->
    <div class="card">
      <h2 class="card-title">빠른 메뉴</h2>
      <div style="display: grid; gap: 0.75rem; margin-top: 1rem;">
        <a href="record.html" class="btn btn-primary">운동 기록하기</a>
        <a href="inbody.html" class="btn btn-success">인바디 기록하기</a>
        <a href="stats.html" class="btn" style="background: var(--text-secondary); color: white;">
          통계 보기
        </a>
      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-label">히스토리</div>
    </a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
