<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 운동 트래커</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    .login-card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 3rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    
    .login-input {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border: 2px solid #374151;
      border-radius: 0.5rem;
      background: #1f2937;
      color: #ffffff !important;
      margin-bottom: 1.5rem;
      transition: all 0.3s;
      -webkit-text-fill-color: #ffffff;
    }
    
    .login-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    
    .login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .login-info {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
    }
    
    .error-message {
      color: var(--danger);
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .user-badge {
      padding: 0.5rem 1rem;
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .user-badge:hover {
      background: rgba(139, 92, 246, 0.3);
      border-color: rgba(139, 92, 246, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">💪 운동 트래커</h1>
      <p class="login-subtitle">사용자 이름을 입력하세요</p>
      
      <form id="login-form">
        <input 
          type="text" 
          id="username" 
          class="login-input" 
          placeholder="사용자 이름 (예: 보섭)"
          autocomplete="off"
          required
          autofocus
        >
        
        <button type="submit" class="login-btn">
          시작하기
        </button>
      </form>
      
      <div class="error-message" id="error-message">
        사용자 이름을 입력해주세요
      </div>
      
      <div class="login-info">
        💡 사용자 이름만으로 로그인됩니다
      </div>
      
      <div id="users-list" style="margin-top: 1.5rem;">
        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; text-align: center;">
          등록된 사용자
        </div>
        <div id="users-container" style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">
          <!-- 동적으로 생성 -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
