<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>운동 기록 - 운동 트래커</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="record">
  <header>
    <div class="header-content">
      <h1>운동 기록</h1>
      <a href="index.html" class="btn" style="background: var(--bg-main); color: var(--text-primary); padding: 0.5rem 1rem;">
        돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2 class="card-title">오늘의 운동</h2>
      
      <!-- 날짜 및 루틴 선택 -->
      <div class="form-group">
        <label class="form-label">운동 날짜</label>
        <input type="date" id="workout-date" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">운동 루틴</label>
        <select id="workout-type" class="form-select">
          <option value="하체">하체</option>
          <option value="등">등</option>
          <option value="가슴어깨">가슴 / 어깨</option>
        </select>
      </div>

      <!-- 운동 입력 폼 -->
      <div id="exercise-form" class="exercise-grid">
        <!-- 동적으로 생성됨 -->
      </div>

      <button id="save-workout" class="btn btn-success btn-full">
        운동 기록 저장하기
      </button>
    </div>

    <!-- 팁 카드 -->
    <div class="card" style="background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 1px solid #bfdbfe;">
      <h3 style="color: var(--primary); margin-bottom: 0.75rem; font-size: 1rem;">💡 기록 팁</h3>
      <ul style="color: var(--text-secondary); line-height: 1.8; padding-left: 1.25rem; font-size: 0.95rem;">
        <li>무게를 올리지 못한 운동은 공란으로 남겨도 됩니다</li>
        <li>코멘트에는 컨디션, 자세, 느낌 등을 자유롭게 적어주세요</li>
        <li>증량은 2~3회 안정적으로 성공한 후에 시도하세요</li>
        <li>정확한 데이터가 더 나은 분석을 만듭니다 📊</li>
      </ul>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-label">히스토리</div>
    </a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
