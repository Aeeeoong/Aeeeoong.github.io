<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>설정 - 운동 트래커</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="settings">
  <header>
    <div class="header-content">
      <h1>설정</h1>
      <a href="index.html" class="btn" style="background: var(--bg-main); color: var(--text-primary); padding: 0.5rem 1rem;">
        돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <!-- 루틴 관리 -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 class="card-title" style="margin: 0;">루틴 관리</h2>
        <button id="add-routine-btn" class="btn btn-primary">+ 루틴 추가</button>
      </div>
      
      <div id="routines-list" class="routines-list">
        <!-- 동적으로 생성됨 -->
      </div>
    </div>

    <!-- 데이터 관리 -->
    <div class="card">
      <h2 class="card-title">데이터 관리</h2>
      
      <div style="display: grid; gap: 0.75rem;">
        <button id="export-data" class="btn" style="background: var(--success); color: white;">
          💾 데이터 내보내기
        </button>
        <button id="import-data" class="btn" style="background: var(--primary); color: white;">
          📥 데이터 가져오기
        </button>
        <input type="file" id="import-file" accept=".json" style="display: none;">
        <button id="reset-settings" class="btn" style="background: var(--text-secondary); color: white;">
          🔄 설정 초기화
        </button>
      </div>
    </div>

    <!-- 앱 정보 -->
    <div class="card" style="background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 1px solid #bfdbfe;">
      <h3 style="color: var(--primary); margin-bottom: 0.75rem; font-size: 1rem;">ℹ️ 앱 정보</h3>
      <div style="color: var(--text-secondary); line-height: 1.8; font-size: 0.95rem;">
        <p><strong>버전:</strong> 1.1.0</p>
        <p><strong>업데이트:</strong> 세트별 상세 기록, 설정 페이지</p>
        <p><strong>저장소:</strong> Firebase Firestore + localStorage</p>
        <p style="margin-top: 1rem; font-size: 0.875rem;">
          💡 정기적으로 데이터를 백업하세요!
        </p>
      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-label">히스토리</div>
    </a>
    <a href="settings.html" class="nav-item" data-page="settings">
      <div class="nav-label">설정</div>
    </a>
  </nav>

  <!-- 루틴 추가 모달 -->
  <div id="routine-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">루틴 추가</h3>
        <button class="modal-close" onclick="closeRoutineModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">루틴 이름</label>
          <input type="text" id="routine-name" class="form-input" placeholder="예: 하체, 등, 가슴어깨">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeRoutineModal()">취소</button>
        <button id="save-routine-btn" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <!-- 운동 추가 모달 -->
  <div id="exercise-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="exercise-modal-title">운동 추가</h3>
        <button class="modal-close" onclick="closeExerciseModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">운동 이름</label>
          <input type="text" id="exercise-name" class="form-input" placeholder="예: 브이스쿼트, 레그프레스">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeExerciseModal()">취소</button>
        <button id="save-exercise-btn" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- 앱 스크립트 -->
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/pull-to-refresh.js"></script>
</body>
</html>
