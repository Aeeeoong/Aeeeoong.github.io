<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>통계 - 운동 트래커</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-page="stats">
  <header>
    <div class="header-content">
      <h1>📊 통계</h1>
      <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
        ← 돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <!-- 인바디 변화 그래프 -->
    <div class="card">
      <h2 class="card-title">인바디 변화 추이</h2>
      
      <!-- 인바디 탭 -->
      <div class="inbody-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto;">
        <button class="tab-btn active" data-tab="weight">체중</button>
        <button class="tab-btn" data-tab="muscle">골격근량</button>
        <button class="tab-btn" data-tab="bodyfat">체지방률</button>
      </div>
      
      <div class="chart-container">
        <canvas id="inbody-chart"></canvas>
      </div>
    </div>

    <!-- 운동 선택 -->
    <div class="card">
      <h2 class="card-title">운동별 중량 추이</h2>
      
      <div class="form-group">
        <label class="form-label">운동 루틴</label>
        <select id="routine-select" class="form-select">
          <option value="하체">하체</option>
          <option value="등">등</option>
          <option value="가슴어깨">가슴 / 어깨</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">운동 선택</label>
        <select id="exercise-select" class="form-select">
          <!-- 동적으로 생성 -->
        </select>
      </div>

      <div class="chart-container">
        <canvas id="exercise-chart"></canvas>
      </div>
    </div>

    <!-- 운동 분포 -->
    <div class="card">
      <h2 class="card-title">운동 부위별 분포</h2>
      <div class="chart-container" style="height: 250px;">
        <canvas id="distribution-chart"></canvas>
      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" data-page="dashboard">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">홈</div>
    </a>
    <a href="record.html" class="nav-item" data-page="record">
      <div class="nav-icon">📝</div>
      <div class="nav-label">기록</div>
    </a>
    <a href="inbody.html" class="nav-item" data-page="inbody">
      <div class="nav-icon">⚖️</div>
      <div class="nav-label">인바디</div>
    </a>
    <a href="stats.html" class="nav-item" data-page="stats">
      <div class="nav-icon">📊</div>
      <div class="nav-label">통계</div>
    </a>
    <a href="history.html" class="nav-item" data-page="history">
      <div class="nav-icon">📚</div>
      <div class="nav-label">히스토리</div>
    </a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
